name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag for manual release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/${{ github.event.inputs.tag }}" >/dev/null 2>&1; then
            echo "Tag '${{ github.event.inputs.tag }}' already exists."
          else
            git tag "${{ github.event.inputs.tag }}" "${GITHUB_SHA}"
            git push origin "refs/tags/${{ github.event.inputs.tag }}"
          fi

      - name: Resolve release version
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG_NAME#v}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate VERSION file
        run: |
          FILE_VERSION="$(tr -d '\n' < VERSION)"
          if [ "$FILE_VERSION" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "VERSION file ($FILE_VERSION) does not match release tag (${{ steps.resolve.outputs.version }})." >&2
            exit 1
          fi

  build:
    needs: prepare-release
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libgl1-mesa-dri \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libglx-dev \
            libglvnd-dev \
            desktop-file-utils \
            imagemagick \
            squashfs-tools \
            x11-utils \
            xvfb

      - name: Download linuxdeploy
        run: |
          mkdir -p .tools

          curl -L \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage" \
            -o ".tools/linuxdeploy-${{ matrix.arch }}.AppImage"

          curl -L \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-${{ matrix.arch }}.AppImage" \
            -o ".tools/linuxdeploy-plugin-appimage-${{ matrix.arch }}.AppImage"

          chmod +x \
            ".tools/linuxdeploy-${{ matrix.arch }}.AppImage" \
            ".tools/linuxdeploy-plugin-appimage-${{ matrix.arch }}.AppImage"

          ln -sf "linuxdeploy-${{ matrix.arch }}.AppImage" .tools/linuxdeploy
          ln -sf "linuxdeploy-plugin-appimage-${{ matrix.arch }}.AppImage" .tools/linuxdeploy-plugin-appimage
          echo "$PWD/.tools" >> "$GITHUB_PATH"

      - name: Build AppImage
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          scripts/build-appimage.sh

      - name: Run regression tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: ctest --test-dir build/appimage/cmake --output-on-failure

      - name: Smoke test AppImage
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          APPIMAGE="dist/coomer-v${VERSION}-${ARCH}.AppImage"
          test -x "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --version | grep -Fx "coomer ${VERSION}"

      - name: Smoke test AppImage window
        env:
          ARCH: ${{ matrix.arch }}
          DISPLAY: :99
          LIBGL_ALWAYS_SOFTWARE: "1"
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          APPIMAGE="dist/coomer-v${VERSION}-${ARCH}.AppImage"
          APP_PID=""
          SCENE_PID=""
          XVFB_PID=""

          cleanup() {
            if [ -n "$APP_PID" ]; then
              kill "$APP_PID" 2>/dev/null || true
            fi
            if [ -n "$SCENE_PID" ]; then
              kill "$SCENE_PID" 2>/dev/null || true
            fi
            if [ -n "$XVFB_PID" ]; then
              kill "$XVFB_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          Xvfb "$DISPLAY" -screen 0 800x600x24 &
          XVFB_PID=$!
          for _ in $(seq 1 20); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          xdpyinfo -display "$DISPLAY" >/dev/null

          xmessage -display "$DISPLAY" \
            -geometry 420x180+190+210 \
            -title "coomer AppImage smoke test" \
            -buttons "Ready:0" \
            "This is deterministic screen content for coomer to capture." &
          SCENE_PID=$!
          SCENE_FOUND=0
          for _ in $(seq 1 20); do
            if xwininfo -display "$DISPLAY" -root -tree |
              grep -Fq '"coomer AppImage smoke test"'; then
              SCENE_FOUND=1
              break
            fi
            sleep 0.25
          done
          if [ "$SCENE_FOUND" -ne 1 ]; then
            echo "failed to create the X11 capture scene" >&2
            exit 1
          fi
          import -display "$DISPLAY" -window root expected.png

          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" &
          APP_PID=$!
          WINDOW_FOUND=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              wait "$APP_PID"
            fi
            if xwininfo -display "$DISPLAY" -root -tree |
              grep -Fq '"coomer": ("coomer" "coomer")'; then
              WINDOW_FOUND=1
              break
            fi
            sleep 1
          done

          if [ "$WINDOW_FOUND" -ne 1 ]; then
            echo "coomer did not open an identifiable X11 window" >&2
            xwininfo -display "$DISPLAY" -root -tree >&2
            exit 1
          fi

          sleep 1
          import -display "$DISPLAY" -window root actual.png
          ERROR=$(compare -metric RMSE expected.png actual.png null: 2>&1 |
            sed -n 's/.*(\([^)]*\)).*/\1/p' || true)
          test -n "$ERROR"
          echo "Rendered screenshot RMSE: ${ERROR}"
          awk -v error="$ERROR" 'BEGIN { exit !(error < 0.02) }'

      - name: Package release assets
        run: |
          mkdir -p release
          cp dist/*.AppImage release/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: release/*

  create-release:
    needs:
      - prepare-release
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          awk -v version="$RELEASE_VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<'NOTES'
          ### Assets

          - `coomer-v${{ needs.prepare-release.outputs.version }}-x86_64.AppImage`
          - `coomer-v${{ needs.prepare-release.outputs.version }}-aarch64.AppImage`

          ### Installation

          Download the AppImage for your CPU architecture, make it executable, and run it:

          ```bash
          chmod +x coomer-v${{ needs.prepare-release.outputs.version }}-<arch>.AppImage
          ./coomer-v${{ needs.prepare-release.outputs.version }}-<arch>.AppImage --version
          ```

          If FUSE is unavailable on your system:

          ```bash
          APPIMAGE_EXTRACT_AND_RUN=1 ./coomer-v${{ needs.prepare-release.outputs.version }}-<arch>.AppImage --version
          ```

          On NixOS, run it with `appimage-run`.

          See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for detailed documentation.
          NOTES

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.AppImage
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
